<!DOCTYPE html>
<html>
<head>
    <title>Lecturer Data</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Rockwell, serif;
    }

    body {
        background: linear-gradient(135deg, #fceff9, #e6f2ff, #f3e8ff);
        min-height: 100vh;
        padding: 40px;
    }

    h2 {
        text-align: center;
        color: #8c6bb1;
        font-size: 40px;
        margin-bottom: 25px;
    }

    /* FORM CARD */
    form {
        background: white;
        max-width: 950px;
        margin: auto;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);

        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;

        margin-bottom: 30px;
    }

    input,
    select {
        padding: 12px;
        border: 2px solid #e8d5ff;
        border-radius: 12px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    input:focus,
    select:focus {
        border-color: #c8b6ff;
        box-shadow: 0 0 10px rgba(200,182,255,0.5);
    }

    /* BUTTON */
    button {
        padding: 12px 22px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        color: white;
        transition: 0.3s;
    }

    /* ADD BUTTON */
    button[type="submit"] {
        background: linear-gradient(
            135deg,
            #ffb3d9,
            #c8b6ff
        );
    }

    button[type="submit"]:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(200,182,255,0.5);
    }

    /* TABLE */
    table {
        width: 100%;
        max-width: 1200px;
        margin: auto;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 20px;
        background: white;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    th {
        background: linear-gradient(
            135deg,
            #c8b6ff,
            #a0d8ef
        );
        color: white;
        padding: 15px;
        font-size: 16px;
    }

    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid #f0f0f0;
    }

    td:nth-child(2) {
        text-align: left;
    }

    tr:nth-child(even) {
        background: #faf7ff;
    }

    tr:hover {
        background: #f4eeff;
        transition: 0.3s;
    }

    /* ACTION BUTTONS */
    .edit-btn {
        background: #a0d8ef;
        margin-right: 5px;
    }

    .edit-btn:hover {
        background: #87c9e8;
        transform: scale(1.05);
    }

    .delete-btn {
        background: #ffb3c6;
    }

    .delete-btn:hover {
        background: #ff99b3;
        transform: scale(1.05);
    }

    /* NOTIFICATION */
    .notification {
        display: none;
        position: fixed;
        top: 30px;
        right: 30px;
        background: linear-gradient(
            135deg,
            #ffb3d9,
            #c8b6ff
        );
        color: white;
        padding: 15px 25px;
        border-radius: 15px;
        font-size: 16px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        z-index: 9999;
    }
</style>
</head>
<body>
    <h2>Lecturer Data</h2>
<form id="lecturerForm">
    <input type="text" name="nidn" placeholder="NIDN" required>
    <input type="text" name="name" placeholder="Name" required>
    <select name="major" required>
    <option value="">Select Major</option>
    <option value="Informatics">Informatics</option>
    <option value="Information Systems">Information Systems</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Design Communication Visual">Design Communication Visual</option>
    <option value="Data Science">Data Science</option>
</select>
    <input type="text" name="course" placeholder="Course" required>
    <button type="submit">
        Add Data
    </button>
</form>
    <table border="1">
        <thead>
            <tr>
                <th>NIDN</th>
                <th>Name</th>
                <th>Major</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tableData">

        </tbody>
    </table>
<h2>Student Data</h2>

<div class="table-container">

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Major</th>
                <th>Class</th>
                <th>Hobby</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>

    </table>

</div>
<div id="notification" class="notification">
    Data has been added successfully!
</div>
    <script src="script.js"></script>

</body>
</html>
